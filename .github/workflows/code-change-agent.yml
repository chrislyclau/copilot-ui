name: Code Change Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Free-text task for the agent to investigate and implement, e.g. "Fix the off-by-one in scripts/foo.ts".'
        required: true
        type: string

permissions:
  contents: read

jobs:
  code-change-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # persist-credentials: false is load-bearing here, not
          # incidental -- actions/checkout otherwise writes an
          # http.extraheader with this token straight into .git/config,
          # which would make it readable (and usable for `git push`) by
          # the agent's bash builtin and by run_terminal_docker's
          # bind-mounted container, defeating create_pr's status as the
          # sole write-capable path. Auth for create_pr's own push is
          # instead injected per-invocation from GH_WRITE_TOKEN -- see
          # agentGitTools.ts.
          token: ${{ secrets.CODE_CHANGE_AGENT_WRITE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Create placeholder branch
        run: |
          git config user.name "code-change-agent"
          git config user.email "code-change-agent@users.noreply.github.com"
          git checkout -b "agent/run-${{ github.run_id }}"

      - name: Start sandbox container
        env:
          CONTAINER_NAME: applet-${{ github.run_id }}
          WORKSPACE_HOST_LOCATION: ${{ github.workspace }}
        run: docker compose up -d

      - name: Run code-change agent
        env:
          # Read-only token for the general session environment (any ad hoc
          # `gh` lookup the agent makes from inside run_terminal_docker).
          # Deliberately NOT the write-scoped token -- see agentGitTools.ts.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate, write-scoped token passed only to create_pr's closure
          # (never read from the general process.env by anything else).
          GH_WRITE_TOKEN: ${{ secrets.CODE_CHANGE_AGENT_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEWER_PROVIDER: ${{ vars.REVIEWER_PROVIDER }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          AGENT_PROMPT: ${{ inputs.prompt }}
          CONTAINER_NAME: applet-${{ github.run_id }}
          WORKSPACE_HOST_LOCATION: ${{ github.workspace }}
          AI_STUDIO: "false"
        run: npm run agent:code-change

      - name: Stop sandbox container
        if: always()
        env:
          CONTAINER_NAME: applet-${{ github.run_id }}
          WORKSPACE_HOST_LOCATION: ${{ github.workspace }}
        run: docker compose down

      - name: Warn on uncommitted changes
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The agent left uncommitted changes in the working tree (it edited files but never called make_commit/create_pr)."
            git status --porcelain
          fi
