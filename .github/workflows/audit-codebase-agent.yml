name: Audit Codebase Agent

on:
  workflow_dispatch:
    inputs:
      spec_paths:
        description: 'Optional comma-separated spec doc path(s) to audit against (e.g. docs/roadmap-spec.md,docs/review-agent-spec.md). Leave blank to auto-discover *-spec.md files.'
        required: false
        type: string
      prompt:
        description: 'Optional extra instructions for the auditor, e.g. which area to focus on or what to skip.'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  audit-codebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Start sandbox container
        env:
          CONTAINER_NAME: applet-${{ github.run_id }}
          WORKSPACE_HOST_LOCATION: ${{ github.workspace }}
        run: docker compose up -d

      - name: Run codebase audit agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEWER_PROVIDER: ${{ vars.REVIEWER_PROVIDER }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          AUDIT_SPEC_PATHS: ${{ inputs.spec_paths }}
          AUDIT_PROMPT: ${{ inputs.prompt }}
          CONTAINER_NAME: applet-${{ github.run_id }}
          WORKSPACE_HOST_LOCATION: ${{ github.workspace }}
          AI_STUDIO: "false"
        run: npm run agent:audit

      - name: Stop sandbox container
        if: always()
        env:
          CONTAINER_NAME: applet-${{ github.run_id }}
          WORKSPACE_HOST_LOCATION: ${{ github.workspace }}
        run: docker compose down
