version: "3.8"

services:
  applet:
    image: node:20-bookworm
    container_name: test-container
    # Keep the container running indefinitely
    command: tail -f /dev/null
    volumes:
      # Mounts the /app directory in a temporary directory on the host machine
      - /tmp/applet_workspace:/app
    environment:
      - NODE_ENV=development
